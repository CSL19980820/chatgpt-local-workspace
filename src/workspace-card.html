else if(tool==='get_workspace_status'){$('meta').textContent='版本 '+d.version+' · '+d.tool_count+' 个工具 · '+d.running_commands+' 个运行中命令'+(d.default_shell?' · 默认 '+d.default_shell:'');notice.push(d.scope||'');body.append(node('div',d.executable||'','command'));const t=node('table',undefined,'dir');for(const a of d.activity||[]){const tr=node('tr');tr.append(node('td',titles[a.tool]||a.tool),node('td',a.target||'—','name'),node('td',({failed:'失败',returned:'已返回',running:'执行中',completed:'完成'}[a.status]||a.status)+(a.error_code?' · '+a.error_code:'')+' · '+Math.round((a.elapsed_ms||0)/1000)+' 秒'));t.append(tr)}body.append(t);if(!d.activity?.length)body.append(node('div','当前实例暂无工具活动。','empty'));const detail=node('details');detail.append(node('summary','可用工具（'+(d.tools?.length||0)+'）'),node('pre',(d.tools||[]).join(' · ')));body.append(detail);for(const plan of d.plans||[]){const group=node('details');group.open=true;group.append(node('summary','执行计划 · '+plan.path),planView(plan.plan,plan.explanation));body.append(group)}raw=JSON.stringify(d,null,2);$('more').hidden=false;$('more').textContent='刷新状态';}

function accept(result,automatic=false){result=unwrapResult(result);let data=result?.structuredContent;if(!data&&result?.tool)data=result;if(!data){if(automatic)throw new Error('宿主未返回命令状态。');return;}if(!automatic){stopRefresh();liveGeneration++;}if(['render_workspace','read_workspace_activity'].includes(data.tool)){livePaused=false;liveInstance=data.result?.instance_id;$('live-pause').textContent='暂停更新';}if(commandTools.has(data.tool)){const d=data.result||{};const previous=commandOutput.get(d.session_id)||'';commandOutput.set(d.session_id,(typeof d.full_output==='string'?d.full_output:d.output_mode==='snapshot'?d.output||'':previous+(d.output||'')).slice(-180000));}images=(result?.content||[]).filter(c=>c.type==='image');current=data;render();scheduleRefresh()}
function showInput(params){stopRefresh();current=null;raw='';$('title').textContent='正在执行工作区操作';$('path').textContent=params?.arguments?.path||params?.arguments?.cwd||'等待实际执行结果';$('badge').textContent='执行中';$('badge').style.color='var(--accent)';$('meta').textContent='工具已开始处理请求';$('body').replaceChildren(node('div',params?.arguments?.cmd||params?.arguments?.command||'正在处理，请稍候…','empty'));$('notice').hidden=true;$('more').hidden=true;$('stop').hidden=true;$('foot').textContent='完成后显示实际结果；长命令将持续更新输出。';notifySize()}

function unwrapResult(value){return value?.mcp_tool_result||value?.call_tool_result?.mcp_tool_result||value}
