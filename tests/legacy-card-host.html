<!doctype html><meta charset="utf-8"><title>旧桥接卡片恢复测试</title>
<style>body{font:14px system-ui;margin:24px;background:#f3f5f6}iframe{width:850px;max-width:100%;height:560px;border:0}p{color:#52616a}</style>
<h1>兼容宿主：从历史元数据恢复卡片</h1>
<p>此页面只提供 window.openai，没有标准 MCP Apps 握手。卡片应直接显示实际模拟结果，握手失败后结果仍保留。</p>
<iframe title="兼容宿主卡片"></iframe>
<script>
const payload={tool:'get_workspace_status',result:{version:'1.4.1',default_shell:'git_bash',tool_count:3,running_commands:0,executable:'preview/LocalWorkspace.exe',tools:['get_workspace_status','exec_command','write_stdin'],activity:[]}};
fetch('/card').then(r=>r.text()).then(html=>{document.querySelector('iframe').srcdoc=html.replace('<script>','<script>window.openai={theme:"light",toolResponseMetadata:{call_tool_result:{mcp_tool_result:{structuredContent:'+JSON.stringify(payload)+'}}},callTool:async()=>({structuredContent:'+JSON.stringify(payload)+'})};<\/script><script>')});
window.addEventListener('message',e=>{if(e.source!==document.querySelector('iframe').contentWindow)return;if(e.data?.method==='ui/initialize')e.source.postMessage({jsonrpc:'2.0',id:e.data.id,error:{code:-32601,message:'Legacy host: standard bridge unavailable'}},'*')});
</script>
